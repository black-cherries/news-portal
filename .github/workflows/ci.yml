# Runs every test on pushes and pull requests.
# Actions are pinned to full commit SHAs (tag in the comment) so a moved or
# compromised tag cannot change what runs here.
name: CI

on:
  push:
    branches: [main, 'phase-*/**', 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25, PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database that exists only for this job.
          POSTGRES_DB: newsportal_test
          POSTGRES_USER: newsportal_test
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsportal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/newsportal_test
      TEST_DB_USERNAME: newsportal_test
      TEST_DB_PASSWORD: ci-only-not-a-secret
      TEST_RESTORE_DB_URL: jdbc:postgresql://127.0.0.1:5432/newsportal_test_restore
      # pg_dump must be the same major version as the server.
      PG_BIN_DIR: /usr/lib/postgresql/17/bin
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install PostgreSQL 17 client tools
        run: |
          if [ ! -x "$PG_BIN_DIR/pg_dump" ]; then
            if ! grep -rqs "apt.postgresql.org" /etc/apt/sources.list /etc/apt/sources.list.d/; then
              sudo install -d /usr/share/postgresql-common/pgdg
              sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
                https://www.postgresql.org/media/keys/ACCC4CF8.asc
              . /etc/os-release
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
                | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            fi
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-17
          fi
          "$PG_BIN_DIR/pg_dump" --version
      - name: Create restore-test database
        run: psql -h 127.0.0.1 -U newsportal_test -d newsportal_test -c "CREATE DATABASE newsportal_test_restore"
        env:
          PGPASSWORD: ci-only-not-a-secret
      - name: Run tests
        run: ./mvnw -B test
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
