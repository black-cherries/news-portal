# Shared settings. Secrets and per-environment values come from environment
# variables or from the git-ignored ../.env file (see ../.env.example).
spring:
  application:
    name: news-portal-backend
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: NPSESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

newsportal:
  ops:
    # Folder containing pg_dump/pg_restore (same major version as the server). Empty = on PATH.
    pg-bin-dir: ${PG_BIN_DIR:}
    backup:
      schedule-enabled: ${BACKUP_SCHEDULE_ENABLED:true}
      # For the pilot, point this at a different disk from the database.
      dir: ${BACKUP_DIR:../data/backups}
      cron: ${BACKUP_CRON:0 30 2 * * *}
      retention-days: ${BACKUP_RETENTION_DAYS:14}
      max-age: PT26H
    restore-test:
      schedule-enabled: ${RESTORE_TEST_SCHEDULE_ENABLED:true}
      # Scratch database owned by the app's role. Never the live database.
      db-url: ${RESTORE_TEST_DB_URL:}
      cron: ${RESTORE_TEST_CRON:0 30 3 * * SUN}
      max-age: P8D
    monitor:
      enabled: ${OPS_MONITOR_ENABLED:true}
      interval: PT5M
      alert-cooldown: PT6H
      min-free-disk-mb: ${MIN_FREE_DISK_MB:2048}
      # Comma-separated. Empty = all active system administrators.
      alert-recipients: ${OPS_ALERT_RECIPIENTS:}
  privacy:
    # FR-052: how long a deleted account can still be restored.
    deletion-recovery-period: ${DELETION_RECOVERY_PERIOD:P7D}
    purge-enabled: ${PRIVACY_PURGE_ENABLED:true}
    # FR-055: list of purged user ids kept outside the database. Store it
    # where database restores do not overwrite it, and include it in backups.
    deletion-ledger-file: ${DELETION_LEDGER_FILE:../data/deletion-ledger.txt}
  notifications:
    # Digests and breaking-news alerts (FR-065..FR-067).
    jobs-enabled: ${NOTIFICATION_JOBS_ENABLED:true}
    check-interval: PT1M
    # Time to cancel a mistaken alert before it is sent.
    alert-hold: ${ALERT_HOLD:PT2M}
    max-alerts-per-reader-per-day: ${MAX_ALERTS_PER_READER_PER_DAY:3}
    max-alerts-per-day: ${MAX_ALERTS_PER_DAY:6}
    batch-size: 200
    delivery-retention: P30D
  mail:
    # outbox = write emails to files (development only); smtp = real delivery via spring.mail.*
    mode: ${MAIL_MODE:outbox}
    from: ${MAIL_FROM:no-reply@localhost}
    outbox-dir: ${MAIL_OUTBOX_DIR:../.mail-outbox}
    public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:5173}
  ingestion:
    scheduler-enabled: ${INGESTION_SCHEDULER_ENABLED:true}
    poll-interval: PT1M
    user-agent: NewsPortalBot/0.1 (local pilot)
    connect-timeout: PT10S
    request-timeout: PT30S
    max-feed-bytes: 5242880
    max-items-per-feed: 200
    max-backoff: PT6H

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
